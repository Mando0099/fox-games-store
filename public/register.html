<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | TECH GAMING</title>
  <!-- خط Cairo الفخم -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/fox-auth.css"/>
  
  <!-- تنسيق الـ Toast Popup العائم والأنيميشن الاحترافي -->
  <style>
    #customModal {
      display: none;
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(18, 18, 20, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #00f3ff;
      padding: 20px 30px;
      border-radius: 14px;
      z-index: 99999;
      min-width: 320px;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.25);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #customModal.show-modal {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
    #modalIcon {
      font-size: 30px;
      margin-bottom: 6px;
    }
    #modalMessage {
      color: #f3f4f6;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 15px;
      font-family: 'Cairo', sans-serif;
    }
    #modalBtn {
      background: linear-gradient(135deg, #00f3ff, #0066ff);
      color: #000;
      border: none;
      padding: 8px 22px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
    }
    #modalBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 243, 255, 0.5);
    }
  </style>
</head>
<body class="foxAuthPage">

  <!-- خلفية الجيمنج المتحركة وشعارات TECH GAMING المضيئة -->
  <div class="gaming-bg-elements">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="floating-logo-bg">TECH GAMING</div>
    <div class="floating-logo-bg logo-2">TECH GAMING</div>
    <div class="floating-logo-bg logo-3">TECH GAMING</div>
  </div>

  <main class="foxAuthStage">
    <section class="foxCard">
      <div class="foxLogoRow" style="justify-content: center; margin-bottom: 25px;">
        <div class="foxLogoText" style="font-size: 28px; letter-spacing: 2px;">TECH <span>GAMING</span></div>
      </div>

      <h1>إنشاء حساب جديد</h1>

      <div class="foxField">
        <input id="fullName" placeholder="الاسم الكامل">
      </div>
      <div class="foxField">
        <input id="email" placeholder="البريد الإلكتروني">
      </div>
      <div class="foxField">
        <input id="password" type="password" placeholder="كلمة المرور">
      </div>
      <div class="foxField">
        <input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور">
      </div>

      <div class="foxPhoneGrid">
        <div class="foxField">
          <select id="countryCode">
            <option value="">الدولة</option>
            <option value="+20">مصر +20</option>
            <option value="+966">السعودية +966</option>
            <option value="+971">الإمارات +971</option>
            <option value="+965">الكويت +965</option>
            <option value="+1">أمريكا +1</option>
          </select>
        </div>
        <div class="foxField">
          <input id="phone" placeholder="رقم الهاتف (اختياري)">
        </div>
      </div>

      <button class="foxPrimary" onclick="createAccount()">تسجيل حساب</button>

      <p class="foxBottomText">لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a></p>
      <a class="foxSmallBack" href="/">العودة إلى المتجر</a>
      <div class="foxMsg" id="msg"></div>
    </section>
  </main>

  <!-- نافذة منبثقة عائمة واحترافية (Floating Toast Modal) -->
  <div id="customModal">
    <div id="modalIcon">⚡</div>
    <p id="modalMessage"></p>
    <button id="modalBtn" onclick="closeModal()">حسناً</button>
  </div>

  <!-- سكربتات فايربيز وموقعك -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
